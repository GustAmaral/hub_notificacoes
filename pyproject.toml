[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hub_notificacoes"
version = "0.1.0"
description = "Hub Unificado de Webhooks e Notificações — núcleo de envio (módulo A / UC01)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Gustavo Henrique", email = "gustavo@example.com" },
    { name = "Pedro Lucas", email = "pedro@example.com" },
    { name = "Vinicius Zopelar", email = "vinicius@example.com" },
]
license = { text = "MIT" }
keywords = ["webhooks", "notificacoes", "discord", "email", "api", "hub"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools]
packages = ["src"]
